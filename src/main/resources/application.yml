server:
  port: ${SERVER_PORT:8080}

spring:
  jackson:
    deserialization:
      # Strict contract: LLM-supplied totals or renamed fields must fail loudly.
      fail-on-unknown-properties: true
  servlet:
    multipart:
      max-file-size: ${MAX_SUPPORTING_DOCUMENT_SIZE_BYTES:15728640}
      max-request-size: ${MAX_SUPPORTING_DOCUMENT_SIZE_BYTES:15728640}

llm:
  provider: ${LLM_PROVIDER:google-gemini}
  api-key: ${LLM_API_KEY:}
  base-url: ${LLM_BASE_URL:https://generativelanguage.googleapis.com}
  model: ${LLM_MODEL:gemini-3.8-flash}
  api-version: ${LLM_API_VERSION:v1beta}
  timeout: ${LLM_TIMEOUT_SECONDS:60}s
  max-retries: ${LLM_MAX_RETRIES:2}
  max-output-tokens: ${LLM_MAX_OUTPUT_TOKENS:4096}
  temperature: ${LLM_TEMPERATURE:0.0}
  extraction-prompt-version: ${LLM_EXTRACTION_PROMPT_VERSION:v1}
  extraction-schema-version: ${LLM_EXTRACTION_SCHEMA_VERSION:v1}

upload:
  max-image-size-bytes: ${MAX_IMAGE_SIZE_BYTES:10485760}
  max-supporting-document-size-bytes: ${MAX_SUPPORTING_DOCUMENT_SIZE_BYTES:15728640}

pdf:
  template-version: ${PDF_TEMPLATE_VERSION:v1}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.vlg: INFO
